[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maritime-decarbonization-policy-lab"
version = "0.1.0"
description = "Regulation Coupling Index (RCI) framework for EU maritime decarbonisation under CII, FuelEU Maritime, and EU ETS"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Maritime Decarbonisation Policy Lab Contributors" }]
keywords = [
    "maritime",
    "carbon",
    "compliance",
    "digital-twin",
    "CII",
    "FuelEU",
    "EU-ETS",
    "IMO",
    "shipping",
    "decarbonization",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=15.0",
    "geopandas>=1.0",
    "shapely>=2.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "click>=8.1",
    "rich>=13.0",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "plotly>=5.22",
    "ortools>=9.10",
    "pyomo>=6.7",
    "tqdm>=4.66",
    "requests>=2.32",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
gpu = [
    "torch>=2.3",
    "lightning>=2.3",
    "gpytorch>=1.11",
]
ml = [
    "torch>=2.3",
    "gpytorch>=1.11",
]
dashboard = [
    "streamlit>=1.35",
]
all = ["ship-carbon-twin[dev,ml,dashboard]"]

[project.scripts]
sct = "carbon_twin.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["carbon_twin"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
