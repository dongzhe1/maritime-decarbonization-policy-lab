# Case study: container ship fleet on Asia-Europe trade lane
# Used by scripts/optimize_fleet.py for Experiment 4 (single vs multi-regulation optimization)

case:
  name: "container_fleet"
  description: "Representative container ship fleet on the Asia-Europe trade lane"
  year: 2026

fleet:
  - vessel_id: "IMO9000001"
    name: "CaseShip-A"
    ship_type: "container_ship"
    gt: 140000
    dwt: 135000
    teu_capacity: 14000
    main_engine_mcr_kw: 72000
    design_speed_kn: 22.0
    age_years: 8
    flag: "MH"

  - vessel_id: "IMO9000002"
    name: "CaseShip-B"
    ship_type: "container_ship"
    gt: 100000
    dwt: 95000
    teu_capacity: 10000
    main_engine_mcr_kw: 52000
    design_speed_kn: 21.5
    age_years: 12
    flag: "PA"

  - vessel_id: "IMO9000003"
    name: "CaseShip-C"
    ship_type: "container_ship"
    gt: 60000
    dwt: 58000
    teu_capacity: 5500
    main_engine_mcr_kw: 30000
    design_speed_kn: 20.0
    age_years: 5
    flag: "LR"

routes:
  - route_id: "AEX_MAIN"
    description: "Shanghai to Rotterdam (Asia-Europe mainlane)"
    departure_port: "CNSHA"
    arrival_port: "NLRTM"
    distance_nm: 11500
    eea_inbound: true
    eea_outbound: true
    ets_scope: 0.5
    port_stays_hours: [48, 36]
    waypoints:
      - Singapore
      - Suez Canal
      - Port Said
      - Malta
      - Rotterdam

  - route_id: "INTRA_EU"
    description: "Rotterdam to Hamburg (intra-EEA feeder)"
    departure_port: "NLRTM"
    arrival_port: "DEHAM"
    distance_nm: 260
    eea_inbound: true
    eea_outbound: true
    ets_scope: 1.0

fuels:
  primary:
    type: "VLSFO"
    supplier_port: "SGSIN"
  alternative:
    type: "biodiesel_B30"
    blending_ratio: 0.30
    availability: constrained

operating_profile:
  voyages_per_year: 6
  average_load_factor: 0.85
  port_waiting_hours_avg: 12

optimization_targets:
  - total_compliance_cost
  - co2e_emissions
  - cii_rating
  - fueleu_balance

baseline_strategy:
  speed_kn: 20.5
  fuel: "VLSFO"
  jit: false
  pooling: false
