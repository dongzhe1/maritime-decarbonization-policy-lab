scenario:
  name: "imo_nzf_mepc83"
  description: "IMO Net-Zero Framework scenario based on MEPC 83 draft"
  year: 2030

  regulations:
    cii:
      version: "IMO_CII_2023_phase1"
      enabled: true
    fueleu:
      version: "EU_2023_1805"
      enabled: true
    eu_ets:
      version: "EU_ETS_Maritime_2024"
      enabled: true
    imo_nzf:
      version: "MEPC83_draft"
      enabled: true

  imo_nzf_params:
    ghg_price_per_tCO2e:
      low: 50
      mid: 100
      high: 200
    gfi_reduction_target:
      2028: 0.04
      2030: 0.10
      2035: 0.25
      2040: 0.50
      2050: 1.00
    scope: "well_to_wake"
    reward_units: true
    pooling: true

  fuel_prices: "base_2026"
  eua_price: "base"

  fleet_defaults:
    main_fuel: "VLSFO"
    aux_fuel: "MGO"
    speed_reduction_pct: 0.0
    shore_power: false
