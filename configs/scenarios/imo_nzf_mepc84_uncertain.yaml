scenario:
  name: "imo_nzf_mepc84_uncertain"
  description: "IMO NZF MEPC 84 uncertain scenario for stress testing"
  year: 2030

  regulations:
    cii:
      version: "IMO_CII_2023_phase1"
      enabled: true
    fueleu:
      version: "EU_2023_1805"
      enabled: true
    eu_ets:
      version: "EU_ETS_Maritime_2024"
      enabled: true
    imo_nzf:
      version: "MEPC84_negotiation"
      enabled: true

  # IMO Net-Zero Framework uncertainty configuration (still under negotiation:
  # no finalized year-by-year GFI path, only scenario-keyed stringency levels).
  imo_nzf_params:
    parameter_uncertainty: high

    # GHG levy / price scenarios (EUR/tCO2e)
    ghg_price_scenarios:
      low: 50
      base: 150
      high: 300

    # GFI (Greenhouse Gas Fuel Intensity) target as fraction of 2008 baseline
    # 2008 baseline attainment value ~91.16 gCO2e/MJ (WtW)
    gfi_target_scenarios:
      lenient: 0.88    # -12% vs 2008
      base: 0.82       # -18% vs 2008
      strict: 0.75     # -25% vs 2008

    # Reward units for early over-compliance
    reward_units: true

    # Well-to-Wake accounting boundary
    wtw_or_ttw: wtw

  # Carbon pricing
  eua_price: 90               # EUR/tCO2e

  # Fuel prices in USD/tonne
  fuel_prices:
    VLSFO: 650
    LNG: 730
    methanol_e: 1700
    ammonia_green: 1600

  # Notes
  notes: >
    Stress-test scenario reflecting MEPC 84 negotiation uncertainty (2025-2026).
    Three price trajectories (low/base/high) and three GFI stringency levels
    (lenient/base/strict) yield a 3x3 = 9-point scenario grid for Monte Carlo
    fleet compliance analysis.
