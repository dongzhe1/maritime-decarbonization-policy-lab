scenario:
  name: "methanol_transition"
  description: "Methanol transition scenario 2028"
  year: 2028

  regulations:
    cii:
      version: "IMO_CII_2023_phase1"
      enabled: true
    fueleu:
      version: "EU_2023_1805"
      enabled: true
    eu_ets:
      version: "EU_ETS_Maritime_2024"
      enabled: true
    imo_nzf:
      version: "MEPC83_draft"
      enabled: true

  # Fuel prices in USD/tonne
  fuel_prices:
    HFO: 520
    VLSFO: 620
    MGO: 790
    LNG: 720
    methanol_e: 1600
    methanol_bio: 1100
    ammonia_green: 1500

  # Carbon pricing
  eua_price: 80               # EUR/tCO2e
  imo_nzf_price_per_tco2e: 100  # EUR/tCO2e

  # Notes
  notes: >
    Assumes green methanol and bio-methanol are commercially available at scale
    from 2027 onward (European production ramp-up per IRENA 2024 outlook).
    Methanol bunkering infrastructure covers major ARA and Singapore hubs.
    Price assumptions: methanol_e reflects electrolyser CAPEX at 80 EUR/MWh
    electricity; methanol_bio reflects certified waste-residue feedstock.
