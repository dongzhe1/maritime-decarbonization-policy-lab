cii:
  IMO_CII_2023_phase1:
    description: "IMO CII Phase 1 (2023-2026)"
    source: "MARPOL Annex VI, MEPC.352(78), MEPC.353(78), MEPC.354(78), MEPC.355(78)"
    applicable_gt_threshold: 5000
    gases: ["CO2"]
    scope: "global"
    years: [2023, 2024, 2025, 2026]
    reduction_factors:
      2023: 0.05
      2024: 0.07
      2025: 0.09
      2026: 0.11

fueleu:
