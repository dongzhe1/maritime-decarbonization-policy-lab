# Data source registry for ShipCarbonTwin
# Each entry describes where to obtain a dataset and how it maps to the framework.

public:

  thetis_mrv:
    description: "EMSA THETIS-MRV annual CO2 emission reports (EU MRV)"
    url: "https://mrv.emsa.europa.eu/#public/emission-report"
    format: csv
    update_frequency: annual
    license: "EU Open Data"
    schema_fields:
      - imo_number
      - ship_name
      - ship_type
      - flag_state
      - reporting_period
      - total_co2_tonnes
      - distance_nm
      - time_at_sea_hours
      - transport_work
      - verification_status
    notes: "Export via THETIS portal. File name: MRV_CO2_emission_report_<year>.csv"

  noaa_ais:
    description: "NOAA MarineCadastre AIS vessel traffic (US waters)"
    url: "https://marinecadastre.gov/ais/"
    format: "csv / GeoParquet (2024+)"
    update_frequency: "annual (broadcast data by zone)"
    license: "US public domain"
    schema_fields:
      - mmsi
      - base_date_time
      - lat
      - lon
      - sog
      - cog
      - heading
      - vessel_name
      - imo
      - call_sign
      - vessel_type
      - status
      - length
      - width
      - draft
      - cargo
      - transceiver_class
    notes: "Useful for constructing voyage pipelines; best for trans-Pacific/Americas routes"

  danish_ais:
    description: "Danish Maritime Authority open AIS (European waters)"
    url: "https://www.dma.dk/safety-at-sea/navigational-information/ais-data"
    format: csv
    update_frequency: daily
    license: "Open (CC BY)"
    schema_fields:
      - mmsi
      - timestamp
      - lat
      - lon
      - sog
      - cog
      - heading
      - nav_status
      - rot
      - draught
      - destination
      - eta
    notes: "Best for EEA-port-adjacent scope tagging; covers North Sea / Baltic"

  amsa_ais:
    description: "Australian Maritime Safety Authority AIS"
    url: "https://www.amsa.gov.au/vessels-operators/navigating-australian-waters/ais-data"
    format: csv
    update_frequency: periodic
    license: "Australian Government Open Access"
    notes: "Useful for Asia-Pacific route validation"

  era5:
    description: "ECMWF ERA5 global atmospheric reanalysis (wind, wave, temperature)"
    url: "https://cds.climate.copernicus.eu/cdsapp#!/dataset/reanalysis-era5-single-levels"
    format: netCDF / zarr
    update_frequency: "5-day lag from real-time"
    license: "Copernicus (free for research)"
    key_variables:
      - u10: "10m eastward wind (m/s)"
      - v10: "10m northward wind (m/s)"
      - mwd: "mean wave direction"
      - mwp: "mean wave period"
      - swh: "significant height of combined wind waves and swell"
    notes: "Combine with voyage timestamps/positions to derive weather penalty factor"

  copernicus_marine:
    description: "Copernicus Marine Service (ocean currents, SST)"
    url: "https://marine.copernicus.eu/"
    format: netCDF / zarr
    update_frequency: varies by product
    license: "Copernicus (free for research)"
    key_products:
      - GLOBAL_ANALYSISFORECAST_PHY_001_024: "Ocean current velocity (u/v)"
      - GLOBAL_MULTIYEAR_PHY_001_030: "Historical ocean physics reanalysis"
    notes: "Add current vectors to speed-over-ground → speed-through-water correction"

  world_port_index:
    description: "NGA World Port Index (port locations and characteristics)"
    url: "https://msi.nga.mil/Publications/WPI"
    format: csv / GeoJSON
    update_frequency: annual
    license: "US Government, public domain"
    schema_fields:
      - port_number
      - port_name
      - country_code
      - latitude
      - longitude
      - harbor_type
      - shelter
      - entry_restriction
    notes: "Use with EEA port list to flag scope. Supplement with EU/EEA official port registry."

  eea_port_list:
    description: "EU/EEA ports subject to FuelEU and EU ETS"
    url: "https://transport.ec.europa.eu/transport-modes/maritime/decarbonising-maritime-transport-fueleu-maritime_en"
    format: "regulatory annex / manual list"
    notes: "Must be version-controlled; neighbouring transhipment ports excluded per Annex II of FuelEU"

  eua_price:
    description: "EU ETS carbon price (EUA) historical time series"
    url_primary: "https://www.eex.com/en/market-data/environmental-markets"
    url_secondary: "https://ember-climate.org/data/carbon-price-viewer/"
    format: csv
    notes: "Daily close price; EUR/tCO2. Use for historical scenario calibration."

  ship_static:
    description: "Vessel static particulars (GT, DWT, engine power, design speed)"
    sources:
      - "IHS Sea-web (commercial)"
      - "Equasis (EU open, manual query)"
      - "IMO GISIS"
    format: "varies"
    notes: "GT, DWT, main engine MCR, design speed, ship type needed for CII/FuelEU capacity metric"

industry_augmentation:

  noon_report:
    description: "Master's noon report (daily voyage leg: distance, fuel consumed, load, weather)"
    format: "CSV / Excel (company-specific)"
    fields:
      - date
      - position
      - distance_logged
      - fuel_consumed_by_type
      - draught
      - cargo_weight
      - sea_state
      - wind_bf
      - remarks
    notes: "Enables high-accuracy voyage-level fuel disaggregation; not public"

  bunker_delivery_note:
    description: "BDN — fuel quantity, type, density, port, supplier, certification"
    format: "PDF / structured CSV"
    notes: "Needed for FuelEU fuel type and WtW factor assignment; legally required MRV support doc"

  engine_sensor:
    description: "Main/aux engine load, RPM, fuel flow meter readings"
    format: "time-series CSV / IoT stream"
    notes: "Gold-standard fuel consumption; replaces proxy model with direct measurement"

  charter_schedule:
    description: "Contractual voyage schedule, laycan windows, speed instructions"
    format: "internal"
    notes: "Required for delay cost modelling and JIT arrival window construction"

  cargo_data:
    description: "Cargo type, weight, TEU or passenger count per voyage"
    format: "internal"
    notes: "Enables accurate CII capacity metric (transport work)"

  pooling_contracts:
    description: "FuelEU pooling group agreements, balance transfer records"
    format: "internal"
    notes: "Required for pooling optimisation module"
